
{% extends 'base.html' %}
{% block content %}
<h2 class="mb-3">Новый гайд</h2>
<form class="card p-3" method="post" enctype="multipart/form-data">
  <div class="mb-3">
    <label class="form-label">Название</label>
    <input class="form-control" name="title" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Категория</label>
    <select class="form-select" name="category" required>
      {% for c in CATEGORIES %}
        <option value="{{ c }}">{{ c }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Фото (обложка)</label>
    <input type="file" class="form-control" name="image" accept="image/*">
  </div>
  <div class="mb-3">
    <label class="form-label">Описание</label>
    <textarea class="form-control" name="description" rows="8" required></textarea>
  </div>
  <button class="btn btn-neon">Опубликовать</button>
</form>
{% endblock %}
